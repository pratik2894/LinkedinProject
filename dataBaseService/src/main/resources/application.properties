spring.application.name=dataBaseService
server.port=8099

# userService Database
db1.datasource.driver-class-name=org.postgresql.Driver
db1.datasource.url=jdbc:postgresql://localhost:5432/userService
db1.datasource.username=postgres
db1.datasource.password=root
db1.jpa.hibernate.ddl-auto=create-drop
db1.datasource.hikari.maximum-pool-size=20
db1.datasource.hikari.minimum-idle=5
db1.datasource.hikari.connection-timeout=30000
db1.datasource.hikari.idle-timeout=600000
db1.datasource.hikari.max-lifetime=1800000
db1.datasource.hikari.pool-name=PostgresHikariPool

# feedService Database
db2.datasource.driver-class-name=org.postgresql.Driver
db2.datasource.url=jdbc:postgresql://localhost:5432/feedService
db2.datasource.username=postgres
db2.datasource.password=root
db2.jpa.hibernate.ddl-auto=create-drop
db2.datasource.hikari.maximum-pool-size=20
db2.datasource.hikari.minimum-idle=5
db2.datasource.hikari.connection-timeout=30000
db2.datasource.hikari.idle-timeout=600000
db2.datasource.hikari.max-lifetime=1800000
db2.datasource.hikari.pool-name=PostgresHikariPool

#disable the JPA configuration because we are using the pure JDBC connection
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# eureka service registry properties
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
debug=true



# Consumer Config
spring.kafka.consumer.group-id=db-service-group-v2
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.services.dataBaseService.model.User
# Additional Properties
spring.kafka.consumer.properties.spring.json.trusted.packages=com.services.*
